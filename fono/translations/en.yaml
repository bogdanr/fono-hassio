configuration:
  api_key:
    name: Cloud API key (optional)
    description: >-
      Paste a key from Groq, Cerebras, OpenAI, Gemini, OpenRouter or another
      provider Fono supports. Fono recognises the provider and uses it for
      speech, voice and the conversation agent. Leave it empty to stay fully
      local. Everything else is in the Fono panel in the sidebar.
  languages:
    name: Languages (optional)
    description: >-
      Languages Fono listens and speaks in, most used first, for example
      "ro, en". Leave empty to take them from Home Assistant on first start:
      its own language and each voice assistant's, with English added. A
      change here replaces the languages set in the Fono panel.
network:
  10300/tcp: Wyoming, for Home Assistant and voice satellites
