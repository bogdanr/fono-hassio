# Home Assistant app metadata for Fono.
# `version` is the Fono release the app runs. The release workflow builds
# the image for it and only then bumps this line, so Home Assistant never
# offers an update whose image isn't there yet.
name: Fono
version: "0.20.0"
slug: fono
description: Speech-to-text, text-to-speech, wake word and a conversation agent in one app.
url: https://github.com/bogdanr/fono-hassio/tree/main/fono
# Prebuilt by the release workflow, so installing is a ~14 MB download.
image: ghcr.io/bogdanr/{arch}-fono-hassio
# The two architectures Fono releases Linux binaries for.
arch:
  - aarch64
  - amd64
# Start before Home Assistant so the Wyoming endpoint is up when the
# integration loads.
startup: services
boot: auto
init: false
stage: experimental
# Lets Home Assistant restart Fono if it stops answering.
watchdog: tcp://[HOST]:[PORT:10300]
# Offer Fono to Home Assistant's Wyoming integration as a discovered device.
discovery:
  - wyoming
# Home Assistant's API, for the MCP server (home control), its languages,
# and setting up the MCP Server integration.
homeassistant_api: true
# Fono's settings panel in the sidebar.
ingress: true
ingress_port: 10808
panel_icon: mdi:account-voice
panel_title: Fono
ports:
  "10300/tcp": 10300
  "11434/tcp": 11434
ports_description:
  "10300/tcp": Wyoming, for Home Assistant and voice satellites
  "11434/tcp": OpenAI- and Ollama-compatible API (needs a key from the Fono panel)
# Everything else is set in the Fono panel and kept in /data.
options:
  api_key: ""
  languages: ""
schema:
  api_key: password?
  languages: str?
