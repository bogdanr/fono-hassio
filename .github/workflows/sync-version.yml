name: Sync Fono version

# Keeps the add-on in lockstep with upstream Fono releases. Trigger it either
# manually, or from the Fono repo's release workflow via:
#   repository_dispatch (event-type: fono-release, client_payload.version: X.Y.Z)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fono release version (e.g. 0.12.0)"
        required: true
  repository_dispatch:
    types: [fono-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            version="${{ github.event.client_payload.version }}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "No version provided" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply version bump
        run: |
          v="${{ steps.ver.outputs.version }}"
          sed -i -E "s/^version: \".*\"/version: \"$v\"/" fono/config.yaml
          sed -i -E "s#(ghcr.io/bogdanr/fono):[^\"[:space:]]+#\1:$v#g" fono/build.yaml
          if ! grep -q "^## $v" fono/CHANGELOG.md; then
            tmp="$(mktemp)"
            {
              echo "# Changelog"
              echo
              echo "## $v"
              echo
              echo "- Track Fono $v."
              echo
              tail -n +2 fono/CHANGELOG.md
            } > "$tmp"
            mv "$tmp" fono/CHANGELOG.md
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: track Fono ${{ steps.ver.outputs.version }}"
          title: "Track Fono ${{ steps.ver.outputs.version }}"
          body: >-
            Automated bump of the add-on `version`, pinned image tag, and
            changelog to Fono ${{ steps.ver.outputs.version }}.
          branch: "bump/fono-${{ steps.ver.outputs.version }}"
          signoff: true
          delete-branch: true
